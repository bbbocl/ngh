name: Auto Update Manifest

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'manifest.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate manifest.json
        run: |
          node -e '
            const fs = require("fs");
            const files = fs.readdirSync(".");
            const system = new Set(["master.user.js", "core.js"]);
            const scripts = files.filter(f => f.endsWith(".js") && !system.has(f)).sort();
            let masterVersion = "0.0";
            if (fs.existsSync("master.user.js")) {
              const m = fs.readFileSync("master.user.js", "utf8").match(/\/\/\s*@version\s+([^\s]+)/);
              if (m) masterVersion = m[1].trim();
            }
            const manifest = {
              commit: process.env.GITHUB_SHA,
              updatedAt: new Date().toISOString(),
              masterVersion,
              scripts
            };
            fs.writeFileSync("manifest.json", JSON.stringify(manifest, null, 2) + "\n");
          '

      - name: Commit manifest.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "Auto-update manifest.json [skip ci]"
          git push

      - name: Purge & warm jsDelivr cache
        run: |
          sleep 5
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/manifest.json" > /dev/null || true
          curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/master.user.js" > /dev/null || true
          sleep 3
          curl -s "https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/manifest.json" > /dev/null || true
          curl -s "https://cdn.jsdelivr.net/gh/${{ github.repository }}@main/master.user.js" > /dev/null || true
